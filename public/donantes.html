<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Donantes - Sistema de Donaciones</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="dashboard">

        <header class="dashboard-header">
            <div>
                <h1>Sistema de Donaciones</h1>
                <p>Registro y consulta de donantes</p>
            </div>

            <button id="cerrarSesion">
                Cerrar sesión
            </button>
        </header>

        <section class="donantes-section">

            <div class="section-title">
                <h2>Donantes registrados</h2>

                <button id="nuevoDonante">
                    + Registrar donante
                </button>
            </div>

            <div id="formularioDonante" class="formulario-donante oculto">

    <h3>Registrar nuevo donante</h3>

    <form id="donanteForm">

        <label for="nombre">Nombre completo</label>
        <input type="text" id="nombre" required>

        <label for="correo">Correo electrónico</label>
        <input type="email" id="correo" required>

        <label for="telefono">Teléfono</label>
        <input type="text" id="telefono" required>

        <label for="tipoRecurso">Tipo de recurso</label>
        <input type="text" id="tipoRecurso" placeholder="Ej. Despensa, ropa, dinero" required>

        <label for="cantidad">Cantidad</label>
        <input type="number" id="cantidad" min="1" required>

        <div class="formulario-botones">
            <button type="submit">Guardar donante</button>
            <button type="button" id="cancelarDonante">Cancelar</button>
        </div>

        <p id="mensajeDonante"></p>

    </form>

</div>

            <div id="listaDonantes">
                <p>Cargando donantes...</p>
            </div>

        </section>

    </main>

    <script src="donantes.js"></script>

</body>
</html>
